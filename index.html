<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brainchild</title>
<meta name="theme-color" content="#0a0713">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One-column phone app. Home = glowing brain + level, nudges, recent sparks; Journal = filterable list; Stats = periods, matrix, badges.
   Single committed dark look: violet-black ground, neon category colours, traffic-light status. */
:root{
  color-scheme:dark;
  --bg:#0a0713; --s1:#130e22; --s2:#1b1430; --s3:#251c40; --line:#251d3d; --line2:#33295a;
  --text:#f1ecff; --muted:#a59cc4; --faint:#665d88;
  --y:#ffd23f; --g:#3ee089; --r:#ff5a6e;
  --pink:#ff4fd8; --vio:#8b5cff; --cyan:#38bdff; --xp:#ffb340;
  --disp:'Syne',ui-rounded,system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.45 var(--body);max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);
  background:radial-gradient(640px 420px at 10% -8%,rgba(139,92,255,.16),transparent 60%),
             radial-gradient(560px 400px at 110% 12%,rgba(255,79,216,.09),transparent 60%),
             radial-gradient(600px 500px at 50% 110%,rgba(56,189,255,.07),transparent 60%),var(--bg);
  background-attachment:fixed;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:13px;padding:11px 12px;width:100%;color-scheme:dark;user-select:text}
textarea{resize:vertical;min-height:70px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff4fd8,#8b5cff,#38bdff,#22e6c8,#ff4fd8);box-shadow:0 0 24px -6px rgba(255,79,216,.8)}
.mark svg{width:22px;height:22px;stroke:#0a0713;stroke-width:2.2}
.brand b{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.3px;background:linear-gradient(90deg,#ff8af0,#b79bff 45%,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-3px}
.lvl{display:flex;align-items:center;gap:8px}
.lvlchip{font-family:var(--disp);font-weight:700;font-size:13px;padding:6px 11px;border-radius:99px;background:linear-gradient(135deg,rgba(255,179,64,.22),rgba(255,79,216,.18));border:1px solid rgba(255,179,64,.45);color:#ffd59a;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--s1);border:1px solid var(--line)}

/* cards */
.card{background:linear-gradient(180deg,rgba(27,20,48,.78),rgba(19,14,34,.92));border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:12px;position:relative}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.lnk{font-size:12.5px;color:#c4b2ff;font-weight:600;padding:4px 2px}
.demo{font-size:12.5px;color:var(--y);background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.25);border-radius:14px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo button{color:var(--text);font-weight:700;white-space:nowrap;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.07)}

/* brain hero */
.hero{padding:10px 12px 14px;overflow:hidden;background:radial-gradient(360px 260px at 50% 42%,rgba(139,92,255,.16),transparent 70%),linear-gradient(180deg,rgba(27,20,48,.85),rgba(16,11,30,.96));border-color:#2e2452}
.brain svg{width:100%;height:auto;display:block;overflow:visible}
.node{transition:r .4s,opacity .4s}
.node.pulse{animation:pulse 1.2s ease-out}
@keyframes pulse{0%{r:3}35%{r:13}100%{r:var(--r)}}
.lit{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.xpfloat{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--disp);font-weight:800;font-size:22px;color:#ffd59a;text-shadow:0 0 16px rgba(255,179,64,.9);pointer-events:none;animation:xpup 1.6s ease-out forwards}
@keyframes xpup{from{opacity:0;transform:translate(-50%,16px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-50px)}}
.hstat{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:2px}
.hstat .big{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;letter-spacing:-1px}
.hstat .big small{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600;letter-spacing:0;margin-left:4px}
.hstat .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.goal{text-align:right;font-size:12px;color:var(--muted)}
.goal b{font-family:var(--disp);font-size:16px;color:var(--text)}
.xpbar{height:9px;border-radius:9px;background:var(--s3);overflow:hidden;margin-top:12px;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,#ff4fd8,#ffb340);box-shadow:0 0 12px rgba(255,140,120,.7);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.xpl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.xpl b{color:#ffd59a;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:rgba(10,7,19,.5);border:1px solid var(--line);border-radius:15px;padding:10px 11px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--disp);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;margin-top:1px}
.kpi .v small{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:600}
.kpi .s{font-size:11px;color:var(--faint)}
.up{color:var(--g)} .dn{color:var(--r)}

/* quick shortcuts */
.qrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qc{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px 9px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);font-weight:600;font-size:13.5px;white-space:nowrap}
.qc .pl{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0713;font-weight:800;font-size:15px;line-height:1}

/* alerts */
.alert{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border-radius:15px;background:color-mix(in srgb,var(--c) 9%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);margin-bottom:8px}
.alert .ai{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
.alert b{display:block;font-size:13.5px}
.alert span{font-size:12.5px;color:var(--muted)}

/* entry card */
.ent{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:11px;width:100%;text-align:left;padding:11px 12px 11px 0;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;overflow:hidden}
.ent .bar{background:var(--c);box-shadow:0 0 12px var(--c);border-radius:0 4px 4px 0}
.ent .tt{font-family:var(--disp);font-weight:700;font-size:15.5px;line-height:1.25;background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--c) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.ent .meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.ent .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,#a59cc4) 13%,transparent);border:1px solid color-mix(in srgb,var(--c,#a59cc4) 30%,transparent);white-space:nowrap}
.tag .ic{width:12px;height:12px}
.stars{color:var(--xp);letter-spacing:1px;font-size:12px;white-space:nowrap}
.stars i{color:#3b3160;font-style:normal}
.xpt{font-size:11px;font-weight:700;color:#ffd59a}
.pick{color:var(--xp)}
.dayh{font-size:11.5px;color:var(--faint);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:14px 2px 7px}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}

/* filters */
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px 2px}
.fl::-webkit-scrollbar{display:none}
.fc{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.fc i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.fc.on{color:var(--text);border-color:var(--c,#8b5cff);background:color-mix(in srgb,var(--c,#8b5cff) 16%,var(--s1));box-shadow:0 0 14px -6px var(--c,#8b5cff)}
.count{font-size:12.5px;color:var(--muted);margin:2px 2px 10px;display:flex;justify-content:space-between}
.count button{color:#c4b2ff;font-weight:600}

/* stats */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:9px;border-radius:10px;font-weight:700;color:var(--muted);font-size:13.5px}
.seg button.on{color:#0a0713;background:linear-gradient(135deg,#ff8af0,#b79bff 55%,#7fd8ff)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pnav h2{margin:0;font-family:var(--disp);font-weight:700;font-size:19px;text-align:center}
.pnav h2 small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.cbar{margin:9px 0}
.cbar .row{white-space:nowrap;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cbar .row span:first-child{display:flex;align-items:center;gap:7px;font-weight:600}
.cbar .row i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.cbar .tr{height:8px;border-radius:8px;background:var(--s3);margin-top:5px;overflow:hidden;display:flex}
.cbar .tr b{height:100%}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mq{text-align:left;padding:11px;border-radius:15px;background:color-mix(in srgb,var(--c) 10%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);min-width:0}
.mq .n{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--c)}
.mq .l{font-weight:700;font-size:13.5px}
.mq .d{font-size:11.5px;color:var(--muted)}
.mxax{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bd{padding:11px 8px;border-radius:15px;text-align:center;background:var(--s1);border:1px solid var(--line);min-width:0}
.bd .bi{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 50%,#000));box-shadow:0 0 18px -4px var(--c)}
.bd .bn{font-size:12px;font-weight:700;line-height:1.2}
.bd .bs{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.bd.off{opacity:.42}
.bd.off .bi{background:var(--s3);box-shadow:none;filter:grayscale(1)}
.reel .ent{margin-bottom:6px}
.wk{font-size:11px;color:var(--xp);font-weight:700;letter-spacing:.6px;margin:10px 2px 5px;text-transform:uppercase}

/* nav + fab */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(10,7,19,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:end}
nav .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:6px 0}
nav .tb.on{color:var(--text)}
nav .tb.on .ic{color:#ff8af0;filter:drop-shadow(0 0 6px rgba(255,79,216,.7))}
.fabw{display:flex;justify-content:center}
.fab{width:60px;height:60px;border-radius:50%;margin-top:-28px;display:grid;place-items:center;color:#0a0713;background:conic-gradient(from 210deg,#ff4fd8,#8b5cff,#38bdff,#22e6c8,#ffd23f,#ff4fd8);box-shadow:0 0 0 5px var(--bg),0 10px 30px -6px rgba(255,79,216,.8)}
.fab .ic{width:28px;height:28px;stroke-width:2.8}
.fab:active{transform:scale(.94)}

/* setup */
.setup h1{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.1;margin:6px 0 6px;background:linear-gradient(90deg,#ff8af0,#b79bff,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.setup p{color:var(--muted);margin:0 0 14px}
.sugg{display:flex;flex-wrap:wrap;gap:7px}
.sg{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--s1);border:1px solid var(--line2);font-weight:600;font-size:13.5px}
.sg i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sg.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--s1));box-shadow:0 0 14px -6px var(--c)}
.catrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:7px}
.catrow .cd{width:34px;height:34px;border-radius:11px;background:var(--c);box-shadow:0 0 14px -3px var(--c)}
.catrow b{font-weight:700}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.sw button{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 10px -3px var(--c)}
.sw button.on{border-color:#fff}

/* sheet + form */
.scrim{position:fixed;inset:0;background:rgba(3,1,8,.68);z-index:10;display:none;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1a1330,#0f0a1d);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.9,.3,1),visibility 0s .25s;user-select:text}
.open .scrim{display:block}
.open .sheet{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-family:var(--disp);font-weight:800;font-size:21px}
.sheet h4{margin:16px 0 7px;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin:12px 0 6px 2px;font-weight:600}
.titlein{font-family:var(--disp);font-weight:700;font-size:19px;padding:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{color:var(--text);border-color:var(--c,#8b5cff);background:color-mix(in srgb,var(--c,#8b5cff) 18%,var(--s2))}
.chip .ic{width:16px;height:16px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stb{padding:10px 6px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);text-align:center;font-weight:700;font-size:13px;color:var(--muted)}
.stb .dot{display:block;margin:0 auto 5px;width:14px;height:14px}
.stb.on{color:var(--text);border-color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,var(--s2));box-shadow:0 0 16px -6px var(--sc)}
.starin{display:flex;gap:4px}
.starin button{font-size:30px;line-height:1;color:#3b3160;padding:2px}
.starin button.on{color:var(--xp);text-shadow:0 0 12px rgba(255,179,64,.7)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog2{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--s2);border:1px solid var(--line2)}
.tog2 button{padding:8px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tog2 button.on{background:var(--s3);color:var(--text)}
.cond{margin-top:12px;padding:12px;border-radius:15px;background:color-mix(in srgb,var(--sc) 7%,transparent);border:1px solid color-mix(in srgb,var(--sc) 30%,transparent)}
.cond .lbl{margin-top:0;color:var(--sc)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);font-weight:700;text-align:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#ff6fe0,#a77bff 50%,#5ac8ff);border:0;color:#0a0713;box-shadow:0 8px 28px -12px rgba(255,79,216,.9)}
.btn.danger{color:var(--r);border-color:rgba(255,90,110,.35)}
.btn.armed{background:rgba(255,90,110,.16);border-color:var(--r)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block;border-radius:11px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1;white-space:nowrap;padding-inline:8px}
.note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.45}
.vt{font-family:var(--disp);font-weight:800;font-size:23px;line-height:1.2;background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--c) 75%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 8px;overflow-wrap:anywhere}
.vbox{padding:11px 12px;border-radius:14px;background:rgba(10,7,19,.5);border:1px solid var(--line);margin-top:8px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.vbox small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px;white-space:normal}
.ba{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:stretch}
.ba .vbox{margin-top:0}
.ba .arr{display:grid;place-items:center;color:var(--g)}
.chain{margin-top:6px}
.chain button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13px;margin-bottom:4px}
.chain button.me{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--s1))}
.chain .down{text-align:center;color:var(--faint);font-size:12px;line-height:1;margin:-1px 0 3px}
.repc{padding:16px;border-radius:20px;background:radial-gradient(300px 200px at 80% 0%,rgba(255,79,216,.18),transparent 70%),linear-gradient(160deg,#1f1640,#120c24);border:1px solid #3a2d6a}
.repc .rh{font-family:var(--disp);font-weight:800;font-size:20px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,16px);width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#221940;border:1px solid var(--line2);padding:11px 14px;border-radius:16px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:20;box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.gold{border-color:rgba(255,179,64,.6);background:linear-gradient(90deg,#3a2414,#221940)}
.toast button{color:#c4b2ff;font-weight:800;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.lit,.node.pulse,.xpfloat{animation:none}.xpbar i{transition:none}}
@media (max-width:380px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header id="hdr">
  <div class="brand"><div class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></div>
    <div><b>BRAINCHILD</b><small>Ideas into improvements</small></div></div>
  <div class="lvl"><span class="lvlchip" id="lvlchip"></span>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</header>
<main id="view"></main>
<nav id="nav"><div class="in">
  <button class="tb" data-act="tab" data-t="home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
  <button class="tb" data-act="tab" data-t="journal"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Journal</button>
  <div class="fabw"><button class="fab" data-act="quick" aria-label="Capture an idea"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <button class="tb" data-act="tab" data-t="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button class="tb" data-act="tab" data-t="awards"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/></svg>Awards</button>
</div></nav>
<div id="sheetWrap"><div class="scrim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script>
(() => {
'use strict';
/* ===================== config ===================== */
const KEY = 'brainchild.v1';
const DAY = 86400000;
const SWATCH = ['#ff4fd8','#8b5cff','#38bdff','#22e6c8','#7dff5a','#ffd23f','#ff9f43','#ff5a6e','#5a7bff','#c084fc','#2dd4bf','#f472b6'];
const SUGGEST = [['Work','#38bdff'],['Investing','#7dff5a'],['Health & fitness','#22e6c8'],['Home & family','#ff9f43'],['Learning','#8b5cff'],['Money','#ffd23f'],['Tech & apps','#ff4fd8'],['Habits','#f472b6']];
const ST = {
  y:{l:'Idea', c:'#ffd23f', d:'Not tried yet'},
  g:{l:'Implemented', c:'#3ee089', d:'Done and working'},
  r:{l:'Dropped', c:'#ff5a6e', d:'Tried or shelved'},
};
const TY = {
  idea:{l:'Idea', i:'bulb'}, sol:{l:'Solution', i:'key'}, mod:{l:'Modification', i:'wrench'}, imp:{l:'Improvement', i:'trend'},
};
const QUAD = {
  qw:{l:'Quick wins', d:'Low effort · high impact', c:'#3ee089'}, bb:{l:'Big bets', d:'High effort · high impact', c:'#8b5cff'},
  fi:{l:'Fill-ins', d:'Low effort · low impact', c:'#38bdff'}, ts:{l:'Time sinks', d:'High effort · low impact', c:'#ff5a6e'},
};
const LEVELS = ['Spark','Tinkerer','Builder','Fixer','Innovator','Architect','Strategist','Visionary','Mastermind','Genius'];
const ICON = {
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8M14.7 6.3 13 4.6a4 4 0 0 0-5.6 5.6L3 14.6 6.4 18"/>',
  trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  flame:'<path d="M12 21c4 0 7-2.7 7-6.5 0-3.3-2.3-5.4-3.8-7.6-.4 2-1.4 3-2.7 3.4C13 7 11 4.7 9 3c.3 3.4-4 6.3-4 11.5C5 18.3 8 21 12 21z"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${ICON[n] || ''}</svg>`;

/* ===================== state ===================== */
const fresh = () => ({cats:[], entries:[], picks:{}, settings:{goal:7}, setupDone:false, badges:[]});
let S = fresh();
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && Array.isArray(d.entries)) S = {...fresh(), ...d, settings:{...fresh().settings, ...(d.settings||{})}}; } catch(e) {}
let warned = false;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ if (!warned){ warned = true; toast('Could not save on this device'); } } }
const UI = {tab:'home', f:{cat:null, st:null, stars:0, ty:null, quad:null, q:''}, pm:'week', po:0, ncColor:SWATCH[0], F:null, spark:null};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const kDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addK = (k,n) => { const d = kDate(k); d.setDate(d.getDate()+n); return iso(d); };
const monday = k => addK(k, -((kDate(k).getDay()+6)%7));
const diffK = (a,b) => Math.round((kDate(b) - kDate(a))/DAY);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice = k => { const d = kDate(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const short = k => { const d = kDate(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const catOf = id => S.cats.find(c => c.id === id) || {id, name:'Uncategorised', color:'#665d88'};
const entOf = id => S.entries.find(e => e.id === id);
const starStr = n => n ? '★'.repeat(n) + `<i>${'★'.repeat(5-n)}</i>` : '';
const quadOf = e => !e.effort || !e.impact ? null : e.impact === 'hi' ? (e.effort === 'lo' ? 'qw' : 'bb') : (e.effort === 'lo' ? 'fi' : 'ts');
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

/* XP: every entry earns, finishing earns most, a dropped idea with a lesson still earns */
function xpOf(e){
  let x = 10;
  if ((e.note||'').trim()) x += 5;
  x += (e.stars||0) * 4;
  if (e.status === 'g') x += 25 + ((e.before||'').trim() && (e.after||'').trim() ? 10 : 0);
  if (e.status === 'r' && (e.lesson||'').trim()) x += 10;
  if (e.parent && entOf(e.parent)) x += 5;
  if (e.effort && e.impact) x += 3;
  return x;
}
const totalXP = () => S.entries.reduce((a,e) => a + xpOf(e), 0) + Object.keys(S.picks).length * 15;
const xpFor = n => 60 * n * (n - 1);            // XP needed to reach level n
function levelOf(xp){ let n = 1; while (xpFor(n+1) <= xp) n++; return {n, name: LEVELS[Math.min(n-1, LEVELS.length-1)] + (n > LEVELS.length ? ` ${n - LEVELS.length + 1}` : ''), lo:xpFor(n), hi:xpFor(n+1)}; }

const inRange = (a,b) => S.entries.filter(e => e.date >= a && e.date <= b);
function weekStreak(){
  const has = new Set(S.entries.map(e => monday(e.date)));
  let w = monday(today()), n = 0;
  if (!has.has(w)) w = addK(w, -7);
  while (has.has(w)) { n++; w = addK(w, -7); }
  return n;
}
function bestWeekStreak(){
  const ws = [...new Set(S.entries.map(e => monday(e.date)))].sort(); let best = 0, run = 0, prev = null;
  ws.forEach(w => { run = prev && addK(prev, 7) === w ? run + 1 : 1; best = Math.max(best, run); prev = w; });
  return best;
}
function chainOf(e){
  let root = e, guard = 0; while (root.parent && entOf(root.parent) && guard++ < 20) root = entOf(root.parent);
  const out = []; const walk = (x, d) => { out.push({e:x, d}); S.entries.filter(c => c.parent === x.id).sort((a,b) => a.date < b.date ? -1 : 1).forEach(c => walk(c, d+1)); };
  walk(root, 0); return out;
}

/* ===================== badges ===================== */
function badgeList(){
  const E = S.entries, g = E.filter(e => e.status === 'g');
  const byMonth = {}; g.forEach(e => { const m = e.date.slice(0,7); byMonth[m] = (byMonth[m]||0) + 1; });
  const longest = Math.max(0, ...E.map(e => chainOf(e).length));
  return [
    {id:'first', n:'First spark', d:'Log your first entry', c:'#ffd23f', i:'✦', ok:E.length >= 1},
    {id:'fix', n:'First fix', d:'Implement an idea', c:'#3ee089', i:'✔', ok:g.length >= 1},
    {id:'five', n:'Green month', d:'5 implemented in a month', c:'#22e6c8', i:'⚡', ok:Object.values(byMonth).some(v => v >= 5)},
    {id:'ten', n:'Ten sparks', d:'10 entries', c:'#38bdff', i:'❿', ok:E.length >= 10},
    {id:'fifty', n:'Idea engine', d:'50 entries', c:'#8b5cff', i:'⚙', ok:E.length >= 50},
    {id:'hund', n:'Centurion', d:'100 entries', c:'#ff4fd8', i:'💯', ok:E.length >= 100},
    {id:'streak4', n:'On a roll', d:'4-week streak', c:'#ff9f43', i:'🔥', ok:bestWeekStreak() >= 4},
    {id:'streak12', n:'Unstoppable', d:'12-week streak', c:'#ff5a6e', i:'☄', ok:bestWeekStreak() >= 12},
    {id:'star5', n:'Five stars', d:'Rate an entry 5★', c:'#ffb340', i:'★', ok:E.some(e => e.stars === 5)},
    {id:'types', n:'All-rounder', d:'Use all 4 entry types', c:'#c084fc', i:'◆', ok:Object.keys(TY).every(t => E.some(e => e.type === t))},
    {id:'lesson', n:'Lesson learned', d:'Write a lesson on a dropped idea', c:'#ff5a6e', i:'✎', ok:E.some(e => e.status === 'r' && (e.lesson||'').trim())},
    {id:'chain', n:'Chain builder', d:'A chain of 3 linked entries', c:'#5a7bff', i:'⛓', ok:longest >= 3},
    {id:'qw', n:'Quick winner', d:'Implement a quick win', c:'#7dff5a', i:'➶', ok:g.some(e => quadOf(e) === 'qw')},
    {id:'proof', n:'Proof', d:'5 greens with before & after', c:'#2dd4bf', i:'⇄', ok:g.filter(e => (e.before||'').trim() && (e.after||'').trim()).length >= 5},
    {id:'explorer', n:'Explorer', d:'Entries in 5 categories', c:'#f472b6', i:'✺', ok:new Set(E.map(e => e.cat)).size >= 5},
    {id:'thinker', n:'Deep thinker', d:'10 entries with notes', c:'#38bdff', i:'✍', ok:E.filter(e => (e.note||'').trim()).length >= 10},
    {id:'finisher', n:'Finisher', d:'60%+ green rate over 10 decided', c:'#3ee089', i:'◎', ok:(() => { const dd = E.filter(e => e.status !== 'y'); return dd.length >= 10 && g.length/dd.length >= .6; })()},
    {id:'picks', n:'Highlight reel', d:'4 weekly top picks', c:'#ffd23f', i:'🏆', ok:Object.keys(S.picks).length >= 4},
  ];
}
function checkBadges(){
  const got = badgeList().filter(b => b.ok).map(b => b.id), fresh = got.filter(id => !S.badges.includes(id));
  S.badges = got; return fresh.map(id => badgeList().find(b => b.id === id));
}

/* ===================== brain ===================== */
const LOBES = [[95,112,52],[150,80,60],[214,86,56],[252,135,44],[205,158,52],[135,162,52],[82,150,38],[170,125,55]];
const CEREB = [236,196,26];
const NODES = (() => {
  let r = 41; const rnd = () => (r = (r*9301 + 49297) % 233280)/233280, pts = [];
  const inside = (x,y) => LOBES.some(([cx,cy,rr]) => Math.hypot(x-cx, y-cy) < rr - 12);
  for (let i = 0; i < 4000 && pts.length < 42; i++){
    const x = 40 + rnd()*250, y = 25 + rnd()*185;
    if (inside(x,y) && pts.every(p => Math.hypot(p[0]-x, p[1]-y) > 23)) pts.push([Math.round(x), Math.round(y)]);
  }
  return pts;
})();
const EDGES = (() => {
  const set = new Set(), out = [];
  NODES.forEach((p,i) => {
    NODES.map((q,j) => [j, Math.hypot(p[0]-q[0], p[1]-q[1])]).filter(([j]) => j !== i).sort((a,b) => a[1]-b[1]).slice(0,3)
      .forEach(([j,d]) => { const k = i < j ? `${i}-${j}` : `${j}-${i}`; if (d < 60 && !set.has(k)) { set.add(k); out.push([Math.min(i,j), Math.max(i,j)]); } });
  });
  return out;
})();
const hash = s => { let h = 7; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; };
function assignNodes(list){
  const used = new Map();
  list.forEach(e => { let i = hash(e.id) % NODES.length, g = 0; while (used.has(i) && g++ < NODES.length) i = (i+1) % NODES.length; if (!used.has(i)) used.set(i, e); });
  return used;
}
function brainSVG(){
  const wk = monday(today()), list = inRange(wk, addK(wk, 6)).sort((a,b) => a.t - b.t), lit = assignNodes(list);
  const fill = Math.min(1, list.length / S.settings.goal), greens = list.filter(e => e.status === 'g').length;
  const oc = fill >= 1 ? '#ffd23f' : '#b79bff';
  let edges = '', nodes = '', gyri = '';
  EDGES.forEach(([a,b]) => {
    const A = NODES[a], B = NODES[b], ea = lit.get(a), eb = lit.get(b);
    if (ea && eb) edges += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${catOf(ea.cat).color}" stroke-width="2" opacity=".75" filter="url(#bg2)"/>`;
    else if (ea || eb) edges += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${catOf((ea||eb).cat).color}" stroke-width="1.2" opacity=".32"/>`;
    else edges += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#3a2d66" stroke-width="1" opacity=".55"/>`;
  });
  NODES.forEach(([x,y], i) => {
    const e = lit.get(i);
    if (!e) { nodes += `<circle cx="${x}" cy="${y}" r="2.6" fill="#4a3c80"/>`; return; }
    const c = catOf(e.cat).color, rr = e.status === 'g' ? 7 : e.status === 'y' ? 5.5 : 4, op = e.status === 'r' ? .55 : 1;
    nodes += `<circle cx="${x}" cy="${y}" r="${rr + 7}" fill="${c}" opacity="${e.status === 'g' ? .28 : .16}" class="lit" filter="url(#bg2)"/>
      <circle class="node" id="n-${e.id}" style="--r:${rr}px" cx="${x}" cy="${y}" r="${rr}" fill="${c}" opacity="${op}" stroke="#fff" stroke-width="${e.status === 'g' ? 1.6 : .8}" stroke-opacity=".8"/>`;
  });
  [['M70 110 q20 -18 40 0 t40 0','',1],['M120 70 q18 14 36 0 t36 0','',1],['M180 120 q15 -15 30 0 t30 0','',1],['M90 160 q20 12 40 0 t40 0','',1],['M200 60 q10 20 0 40','',1],['M150 40 q-6 50 4 120','',1.6]]
    .forEach(([d,,w]) => gyri += `<path d="${d}" fill="none" stroke="#2e2456" stroke-width="${w*3}" stroke-linecap="round"/>`);
  const shape = LOBES.map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('') + `<circle cx="${CEREB[0]}" cy="${CEREB[1]}" r="${CEREB[2]}"/><rect x="176" y="170" width="26" height="62" rx="12"/>`;
  return `<svg viewBox="20 8 300 236" role="img" aria-label="Brain lit by ${list.length} entries this week" id="brainsvg">
    <defs>
      <g id="bshape">${shape}</g>
      <mask id="bmask" maskUnits="userSpaceOnUse" x="0" y="0" width="340" height="260"><use href="#bshape" fill="#fff"/></mask>
      <radialGradient id="bglow" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ff4fd8" stop-opacity="${(.12 + fill*.42).toFixed(2)}"/><stop offset=".6" stop-color="#8b5cff" stop-opacity="${(.08 + fill*.3).toFixed(2)}"/><stop offset="1" stop-color="#38bdff" stop-opacity="${(.04 + fill*.18).toFixed(2)}"/></radialGradient>
      <filter id="bol" x="-10%" y="-10%" width="120%" height="120%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="o"/>
        <feFlood flood-color="${oc}"/><feComposite in2="o" operator="in" result="c"/><feGaussianBlur in="c" stdDeviation="3.2" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="c"/></feMerge></filter>
      <filter id="bg2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>

function dayBars(P, list){

    const tot = by[k] ? by[k].y + by[k].g + by[k].r : 0;

    if (n <= 7 || i % 5 === 0) g += `<text x="${(x + w/2).toFixed(1)}" y="${Hh - 4}" text-anchor="middle" font-size="10" fill="${k === today() ? '#ff8af0' : '#a59cc4'}" font-family="Manrope,system-ui">${n <= 7 ? DOW[kDate(k).getDay()] : kDate(k).getDate()}</text>`;
  });

}

    if (w.n) g += `<rect x="${x.toFixed(1)}" y="${Y(w.n).toFixed(1)}" width="${bwid.toFixed(1)}" height="${(base - Y(w.n)).toFixed(1)}" rx="4" fill="#8b5cff" opacity="${i === 11 ? 1 : .75}"/>`;
    if (w.g) g += `<rect x="${(x + bwid*.25).toFixed(1)}" y="${Y(w.g).toFixed(1)}" width="${(bwid*.5).toFixed(1)}" height="${(base - Y(w.g)).toFixed(1)}" rx="2" fill="#3ee089"/>`;
    if (i % 2 === 1 || i === 11) g += `<text x="${(x + bwid/2).toFixed(1)}" y="${Hh - 4}" text-anchor="middle" font-size="9.5" fill="#a59cc4" font-family="Manrope,system-ui">${short(w.a)}</text>`;
  });
  g += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#33295a"/>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Entries per week">${g}</svg>`;
}

    const before = totalXP();
    const rec = {id:F.id || uid(), t:F.id ? (entOf(F.id).t) : Date.now(), date:F.date || today(), title:F.title, cat:F.cat, type:F.type, status:F.status, stars:F.stars,
      note:F.note.trim(), effort:F.effort, impact:F.impact, revisit:F.status === 'y' ? F.revisit : '', before:F.before.trim(), after:F.after.trim(), lesson:F.lesson.trim(), parent:F.parent || ''};
    if (rec.parent === rec.id) rec.parent = '';
    if (F.id) S.entries = S.entries.map(e => e.id === F.id ? rec : e); else S.entries.push(rec);
    delete S.demo; closeSheet();
    if (!F.id) { UI.tab = 'home'; UI.spark = rec.id; }
    if (navigator.vibrate) navigator.vibrate(22);
    render(); scrollTo(0,0);
    celebrate(before, F.id ? 'Entry updated' : `Spark logged in <b>${esc(catOf(rec.cat).name)}</b>`);
  },
  view: el => sheetView(el.dataset.id),
  edit: el => { const e = entOf(el.dataset.id); UI.F = {...blankF(), ...e, revisit:e.revisit || addK(today(), 14)}; sheetForm(); },
  setst: el => { const e = entOf(el.dataset.id); UI.F = {...blankF(), ...e, status:el.dataset.v, revisit:e.revisit || addK(today(), 14)}; sheetForm(); },
  snooze: el => { const e = entOf(el.dataset.id); e.revisit = addK(e.revisit && e.revisit > today() ? e.revisit : today(), 14); save(); sheetView(e.id); render(); toast(`Revisit moved to ${short(e.revisit)}`); },
  spawn: el => { const e = entOf(el.dataset.id); UI.F = {...blankF(), cat:e.cat, parent:e.id, type:e.status === 'y' ? 'sol' : 'imp'}; sheetForm(); },
  delent: el => arm(el, () => { const e = entOf(el.dataset.id), kids = S.entries.filter(x => x.parent === e.id);
    S.entries = S.entries.filter(x => x.id !== e.id); kids.forEach(k => k.parent = e.parent || ''); save(); closeSheet(); render();
    toast('Entry deleted', '', {label:'Undo', fn:() => { S.entries.push(e); kids.forEach(k => k.parent = e.id); save(); render(); }}); }),
  makepick: el => { const e = entOf(el.dataset.id), w = monday(e.date), before = totalXP(); S.picks[w] = e.id; save(); sheetView(e.id); render(); celebrate(before, `🏆 Top pick for the week of ${short(w)}`); },
  pickweek: el => sheetPick(el.dataset.w),
  dopick: el => { const before = totalXP(); S.picks[el.dataset.w] = el.dataset.id; closeSheet(); render(); celebrate(before, '🏆 Added to your highlights reel'); },
  /* journal filters */
  fcat: el => tog('cat', el.dataset.v), fst: el => tog('st', el.dataset.v), fstars: el => tog('stars', +el.dataset.v), fty: el => tog('ty', el.dataset.v), fquad: el => tog('quad', el.dataset.v),
  fclear: () => { UI.f = {cat:null, st:null, stars:0, ty:null, quad:null, q:''}; render(); },
  gocat: el => goJournal({cat:el.dataset.v}), goquad: el => goJournal({quad:el.dataset.v}),
  /* stats */
  pm: el => { UI.pm = el.dataset.v; UI.po = 0; render(); },
  pnav: el => { UI.po = Math.min(0, UI.po + +el.dataset.v); render(); },
  report: el => sheetReport(el.dataset.a),
  sharerep: async el => { const t = reportText(el.dataset.a).text;
    try { if (navigator.share) { await navigator.share({text:t}); return; } } catch(e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t); toast('Report copied. Paste it anywhere.'); } catch(e) { toast('Could not share from here'); } },
  /* settings */
  settings: () => sheetSettings(),
  goal: el => { S.settings.goal = +el.dataset.v; save(); sheetSettings(); render(); },
  export: () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `brainchild-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); },
  import: () => $('impFile').click(),
  wipe: el => arm(el, () => { S = fresh(); save(); closeSheet(); render(); toast('All Brainchild data deleted'); }),
  cleardemo: () => { S = {...fresh(), cats:S.cats.map(c => ({...c, created:today()})), setupDone:true}; save(); render(); toast('Sample entries cleared. Your categories are kept.'); },
  close: () => closeSheet(),
};
function importData(file){
  if (!file) return; const r = new FileReader();
  r.onload = () => { try {
      const d = JSON.parse(r.result); if (!Array.isArray(d.entries) || !Array.isArray(d.cats)) throw 0;
      const haveE = new Set(S.entries.map(e => e.id)), haveC = new Set(S.cats.map(c => c.id)); let n = 0;
      d.cats.forEach(c => { if (!haveC.has(c.id)) S.cats.push(c); });
      d.entries.forEach(e => { if (!haveE.has(e.id)) { S.entries.push(e); n++; } });
      Object.assign(S.picks, d.picks || {}); S.setupDone = true; delete S.demo; checkBadges(); save(); closeSheet(); render(); toast(`Backup merged · ${n} entries added`);
    } catch(e){ toast('That file is not a Brainchild backup'); } };
  r.readAsText(file);
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('input', e => { if (e.target.id === 'q'){ UI.f.q = e.target.value; $('jlist').innerHTML = journalList(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'fTitle') { e.preventDefault(); A.savef(); } if (e.key === 'Enter' && e.target.id === 'ncName') { e.preventDefault(); A.addcat(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.body.classList.contains('open')) render(); });

/* ===================== sample data (preview only) ===================== */
function seed(){
  let r = 11; const rnd = () => (r = (r*9301 + 49297) % 233280)/233280, pick = a => a[Math.floor(rnd()*a.length)];
  S.cats = [['Work','#38bdff'],['Investing','#7dff5a'],['Health & fitness','#22e6c8'],['Home & family','#ff9f43'],['Tech & apps','#ff4fd8'],['Learning','#8b5cff']]
    .map(([name,color], i) => ({id:'c' + i, name, color, created:addK(today(), -80)}));
  const T = {
    c0:[['Checklist for monthly credit review','Took most of a day','Done by lunch'],['Template for stock-statement follow-ups','Hand-typed each time','Two-minute fill-in'],['Batch the CIMS queries in one sitting'],['Colour-code overdue accounts in the tracker']],
    c1:[['Pre-set exit levels before every buy'],['Track ADTV daily with a script','Manual lookups','Automatic each evening'],['Kill criteria for weak IPO picks'],['Monthly portfolio journal entry']],
    c2:[['Leg extension lying-back sets'],['Water reminder at the 3-hour gap'],['Superset arms to save 15 min','70 min sessions','55 min sessions'],['Stretch before bed']],
    c3:[['Shared expense app with my wife','WhatsApp messages','One app, both phones'],['Baby night-feed rota'],['Weekly meal plan on Sunday'],['Floor-wise EB tracking','Excel sheet','Live dial on the phone']],
    c4:[['Hydra water tracker'],['Sleep report page','Calendar only','Table and graphs'],['Brainchild idea journal'],['Dark theme for all my apps']],
    c5:[['CAIIB: one module a week'],['Flashcards for RBI circulars'],['Read one annual report a month']],
  };
  const tk = today(); let n = 0;
  for (let i = 55; i >= 0; i--){
    const k = addK(tk, -i), cnt = rnd() < .45 ? 0 : rnd() < .7 ? 1 : 2;
    for (let j = 0; j < cnt; j++){
      const ci = 'c' + Math.floor(rnd()*6), t = pick(T[ci]), age = i, roll = rnd();
      const status = age < 4 ? (roll < .75 ? 'y' : 'g') : roll < .5 ? 'g' : roll < .72 ? 'r' : 'y';
      const e = {id:'d' + (n++), t:kDate(k).getTime() + (9 + j*5)*3600000, date:k, title:t[0], cat:ci, type:pick(['idea','sol','mod','imp']), status,
        stars:rnd() < .15 ? 0 : 2 + Math.floor(rnd()*4), note:rnd() < .5 ? 'Noted during the day; worth testing for two weeks.' : '',
        effort:rnd() < .8 ? pick(['lo','hi']) : null, impact:rnd() < .8 ? pick(['lo','hi','hi']) : null,
        revisit:status === 'y' ? addK(k, 7 + Math.floor(rnd()*14)) : '', before:status === 'g' && t[1] ? t[1] : '', after:status === 'g' && t[2] ? t[2] : '',
        lesson:status === 'r' && rnd() < .7 ? 'Too much effort for the gain. Simpler version first next time.' : '', parent:''};
      const prev = S.entries.filter(x => x.cat === ci); if (prev.length && rnd() < .3) e.parent = prev[prev.length - 1].id;
      S.entries.push(e);
    }
  }
  [7, 14, 21, 35].forEach(dd => { const w = monday(addK(tk, -dd)), l = inRange(w, addK(w,6)); if (l.length) S.picks[w] = l.sort((a,b) => b.stars - a.stars)[0].id; });
  S.setupDone = true; S.demo = true; checkBadges();
}
if (window.BC_DEMO && !S.entries.length && !S.cats.length) { seed(); save(); }
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.BC_DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
